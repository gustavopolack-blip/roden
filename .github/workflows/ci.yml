# Control de cada PR y de cada push a main: tipos (tsc) y pruebas (vitest), incluida la foto
# del motor de costos. Si falla, el PR muestra la cruz roja: no mergear hasta arreglarlo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
